<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Для тебя</title>
  <meta name="theme-color" content="#fff7f3">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Pangolin&family=Onest:wght@400;500;600&family=Caveat:wght@500;700&family=Marck+Script&family=Pacifico&family=Bad+Script&family=Neucha&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;background:#fffaf6;color:#3b2430;font-family:"Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body.locked{min-height:100vh;background:radial-gradient(60% 50% at 0 0,#f9c3d0 0,transparent 70%),radial-gradient(60% 50% at 100% 100%,#fcd2bf 0,transparent 70%),#fffaf6}
    .lock{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto}
    .lock-card{box-sizing:border-box;width:100%;max-width:400px;padding:40px 24px 24px;border-radius:32px;background:rgba(255,255,255,.92);box-shadow:0 18px 40px -18px rgba(194,58,99,.35),0 0 0 1px #fdeef0;text-align:center}
    .lock-heart{width:44px;height:44px;fill:#e2507a;animation:beat 1.6s ease-in-out infinite}
    @keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.5)}40%{transform:scale(.95)}60%{transform:scale(1.25)}}
    .lock-title{margin:16px 0 24px;font-family:"Unbounded",system-ui,sans-serif;font-weight:600;font-size:1.375rem;line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
    .lock-label{display:block;margin-bottom:8px;font-size:.875rem;font-weight:500;color:#85636f;text-align:start}
    .lock-input{box-sizing:border-box;width:100%;padding:14px 18px;border:2px solid #f8d9df;border-radius:16px;background:#fffaf6;font:inherit;font-size:16px;color:#3b2430;outline:none}
    .lock-input:focus{border-color:#e2507a}
    .lock-hint{margin:8px 0 0;font-size:.875rem;color:#85636f;text-align:start}
    .lock-error{min-height:1.5em;margin:8px 0;font-size:.875rem;font-weight:500;color:#c23a63}
    .lock-btn{width:100%;padding:14px;border:0;border-radius:999px;background:#e2507a;font:inherit;font-weight:600;font-size:1rem;color:#fff;cursor:pointer}
    .lock-btn:hover{background:#c23a63}.lock-btn:disabled{opacity:.7;cursor:progress}
    .lock-btn:focus-visible,.lock-input:focus-visible{outline:3px solid #e2507a;outline-offset:3px}
    @media (prefers-reduced-motion:reduce){.lock-heart{animation:none}}
  </style>
</head>
<body class="locked">
  <!-- экран с паролем -->
  <div class="lock" id="lock">
    <form class="lock-card" id="lock-form" autocomplete="off">
      <svg class="lock-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <h1 class="lock-title">Этот сайт только для одного человека</h1>
      <label class="lock-label" for="pw">Пароль</label>
      <input class="lock-input" id="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
      <p class="lock-hint">Подсказка: моихороши</p>
      <p class="lock-error" id="lock-error" role="alert"></p>
      <button class="lock-btn" id="lock-btn" type="submit">Открыть</button>
    </form>
  </div>
  <script src="lock.js?v=8"></script>
</body>
</html>
